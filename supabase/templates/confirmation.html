<!doctype html>
<html lang="en">
<body style="margin:0;padding:24px 12px;background:#fff8f0;font-family:Nunito,Helvetica,Arial,sans-serif;color:#1b1b1f;">

    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:24px;border-top:8px solid #7c4dff;">
          <tr>
            <td align="center" style="padding:32px 28px;">
